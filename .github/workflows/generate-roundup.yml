name: Draft next roundup

# Disabled 2026-08-01: content-schedule.csv is gitignored (local-only editorial
# calendar), so this job's own CSV read always fails with ENOENT once it runs
# in a fresh checkout — the schedule trigger below never worked. Manual
# drafting is the active workflow instead. Re-enable the schedule (and add the
# missing ANTHROPIC_API_KEY / SANITY_WRITE_TOKEN repo secrets) only after this
# script no longer depends on the gitignored CSV.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Calendar slug to draft (defaults to the next queued row)'
        required: false

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the updated content-schedule.csv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: sloth-astro-sanity/scripts
        run: npm ci

      - name: Draft roundup
        working-directory: sloth-astro-sanity/scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUBLIC_SANITY_PROJECT_ID: ${{ secrets.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: production
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
        run: |
          node generate-and-publish.js ${{ inputs.slug && format('--slug {0}', inputs.slug) || '' }}

      - name: Commit calendar status change
        run: |
          if [ -n "$(git status --porcelain content-schedule.csv)" ]; then
            git config user.name  "shopping-sloth-bot"
            git config user.email "bot@users.noreply.github.com"
            git add content-schedule.csv
            git commit -m "chore: advance content calendar"
            git push
          fi
