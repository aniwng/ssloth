name: Draft next roundup

# Tuesdays and Fridays, matching the cadence in content-schedule.csv.
# 13:00 UTC ≈ early morning US, so a human has the day to review the draft.
on:
  schedule:
    - cron: '0 13 * * 2,5'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Calendar slug to draft (defaults to the next queued row)'
        required: false

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the updated content-schedule.csv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: sloth-astro-sanity/scripts
        run: npm ci

      - name: Draft roundup
        working-directory: sloth-astro-sanity/scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUBLIC_SANITY_PROJECT_ID: ${{ secrets.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: production
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
        run: |
          node generate-and-publish.js ${{ inputs.slug && format('--slug {0}', inputs.slug) || '' }}

      - name: Commit calendar status change
        run: |
          if [ -n "$(git status --porcelain content-schedule.csv)" ]; then
            git config user.name  "shopping-sloth-bot"
            git config user.email "bot@users.noreply.github.com"
            git add content-schedule.csv
            git commit -m "chore: advance content calendar"
            git push
          fi
