name: Deploy site

# Builds the Astro site and publishes it to GitHub Pages on every push to
# main. Custom domain (shoppingsloth.com) is set via astro/public/CNAME.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sloth-astro-sanity/astro/package-lock.json

      - name: Install
        working-directory: sloth-astro-sanity/astro
        run: npm ci

      # PUBLIC_SANITY_PROJECT_ID is deliberately not set here yet — the
      # Sanity project (364itju4) has no documents in it yet, and setting
      # this flips the site from the seed content to querying Sanity, which
      # would ship an empty site. Add it back as a repo secret once content
      # has been migrated into Sanity (see CLAUDE.md task 2).
      - name: Build
        working-directory: sloth-astro-sanity/astro
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sloth-astro-sanity/astro/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
